apis:
- aid: aveva:aveva-connect-rest-api
  name: AVEVA CONNECT REST API
  description: The AVEVA CONNECT cloud platform REST APIs provide access to industrial
    data services including account management, identity management, data ingress
    pipelines, data views, and time-series retrieval. Enables cloud-native integration
    of OT data from AVEVA System Platform, Plant SCADA, and PI System into analytics
    and enterprise applications.
  humanURL: https://docs.aveva.com/
  baseURL: https://api.connect.aveva.com
  tags:
  - Industrial Data
  - Time Series
  - Asset Management
  - Cloud
  - REST
  properties:
  - url: https://docs.aveva.com/
    type: Documentation
  - url: https://www.aveva.com/en/products/aveva-pi-system-developer-technologies/
    type: Portal
- aid: aveva:aveva-pi-system-rest-api
  name: AVEVA PI System REST API
  description: The AVEVA PI System REST API (PI Web API) provides RESTful HTTP access
    to time- series sensor data, asset metadata, and event frames stored in PI Server.
    Supports GET, POST, PUT, PATCH, and DELETE operations for reading real-time and
    historical process data, managing PI AF asset hierarchies, and streaming data
    via WebSocket.
  humanURL: https://www.aveva.com/en/products/aveva-pi-system-developer-technologies/
  baseURL: https://{pi-server}/piwebapi
  tags:
  - Industrial Data
  - Time Series
  - Process Control
  - Historian
  - REST
  - WebSocket
  properties:
